<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--td:#0f766e;--tl:#14b8a6;--am:#f59e0b;--bg:#0f172a;--bs:#1e293b;--tx:#f1f5f9;--tm:#94a3b8;--bd:rgba(20,184,166,.2);--ok:#10b981}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.7;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at bottom right,rgba(245,158,11,.15),rgba(15,118,110,.08) 30%,transparent 70%);pointer-events:none;z-index:0}
.c{max-width:1200px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1}
header{text-align:center;margin-bottom:60px;padding-bottom:40px;border-bottom:1px solid var(--bd)}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:20px}
.li{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--td),var(--tl));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(15,118,110,.4)}
.li svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.5}
.lt{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--tl),var(--am));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header h1{font-size:42px;font-weight:800;margin-bottom:12px}
header p{font-size:18px;color:var(--tm);max-width:700px;margin:0 auto 24px}
.meta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:14px;color:var(--tm)}
.meta span{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bs);border-radius:100px;border:1px solid var(--bd)}
.meta svg{width:16px;height:16px;stroke:var(--tl);fill:none;stroke-width:1.5}
.ql{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.ql a{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:100px;text-decoration:none;font-weight:500;font-size:15px;transition:.2s;border:1px solid var(--bd)}
.ql a.p{background:linear-gradient(135deg,var(--td),var(--tl));color:#fff;box-shadow:0 8px 24px rgba(15,118,110,.3)}
.ql a.a{background:linear-gradient(135deg,var(--am),#d97706);color:#fff;box-shadow:0 8px 24px rgba(245,158,11,.3)}
.ql a:hover{transform:translateY(-2px)}
.ql svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.tl{position:relative;padding-right:50px}
.tl::before{content:'';position:absolute;right:18px;top:20px;bottom:20px;width:2px;background:linear-gradient(180deg,var(--td),var(--am));opacity:.4}
.st{position:relative;margin-bottom:48px}
.sd{position:absolute;right:-50px;top:20px;width:36px;height:36px;border-radius:50%;background:var(--bg);border:3px solid var(--tl);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(15,118,110,.15);z-index:2}
.sd svg{width:18px;height:18px;stroke:var(--tl);fill:none;stroke-width:2}
.st.cur .sd{border-color:var(--am);box-shadow:0 0 0 6px rgba(245,158,11,.2);animation:p 2s infinite}
.st.cur .sd svg{stroke:var(--am)}
@keyframes p{0%,100%{box-shadow:0 0 0 6px rgba(245,158,11,.2)}50%{box-shadow:0 0 0 12px rgba(245,158,11,.05)}}
.sc{background:var(--bs);border:1px solid var(--bd);border-radius:20px;padding:28px 32px}
.st.cur .sc{border-color:rgba(245,158,11,.4);box-shadow:0 8px 32px rgba(245,158,11,.1)}
.sh{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.sn{font-size:24px;font-weight:700;margin-bottom:4px}
.st.cur .sn{color:var(--am)}
.sb{font-size:14px;color:var(--tm);font-weight:500}
.bdg{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-size:13px;font-weight:500;background:rgba(16,185,129,.1);color:var(--ok);border:1px solid rgba(16,185,129,.2);white-space:nowrap}
.st.cur .bdg{background:rgba(245,158,11,.1);color:var(--am);border-color:rgba(245,158,11,.3)}
.bdg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.stt{display:flex;align-items:center;gap:8px;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px dashed rgba(20,184,166,.2);color:var(--tl);font-size:15px;font-weight:700}
.stt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.ev{list-style:none;display:flex;flex-direction:column;gap:12px}
.e{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.6}
.e.d{color:var(--tm)}
.e.d .et{text-decoration:line-through;text-decoration-color:rgba(148,163,184,.4)}
.ec{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:3px}
.e.d .ec{background:rgba(16,185,129,.15)}
.e.d .ec svg{stroke:var(--ok)}
.e:not(.d) .ec{background:rgba(148,163,184,.15)}
.e:not(.d) .ec svg{stroke:var(--tm)}
.ec svg{width:14px;height:14px;fill:none;stroke-width:2.5}
.et{flex:1}
.ed{display:inline-block;font-size:12px;color:var(--tl);font-weight:500;margin-right:8px;padding:2px 8px;background:rgba(20,184,166,.1);border-radius:6px;vertical-align:middle}
.nt{margin-top:16px;padding:14px 18px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:12px;font-size:14px;line-height:1.6}
.nt strong{color:var(--am)}
footer{margin-top:60px;padding-top:40px;border-top:1px solid var(--bd);text-align:center;color:var(--tm);font-size:14px}
@media(max-width:640px){.c{padding:24px 16px 60px}header h1{font-size:28px}.lt{font-size:24px}.li{width:44px;height:44px}.sc{padding:20px}.sn{font-size:20px}.tl{padding-right:36px}.sd{right:-36px;width:28px;height:28px}.tl::before{right:13px}}
</style>
</head>

  video: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>'
};

function renderSection(section) {
  const eventsHtml = section.events.map(function(ev) {
    const iconClass = ev.done ? 'done' : '';
    const icon = ev.done ? ICONS.check : ICONS.circle;
    const dateHtml = ev.date ? '<span class="ed">' + ev.date + '</span>' : '';
    return '<li class="e ' + iconClass + '"><span class="ec">' + icon + '</span><span class="et">' + ev.text + dateHtml + '</span></li>';
  }).join('');
  const sectionIcon = ICONS[section.icon] || ICONS.book;
  return '<div class="stt">' + sectionIcon + section.title + '</div><ul class="ev">' + eventsHtml + '</ul>';
}

function renderStage(stage) {
  let allEvents = [];
  if (stage.sections) {
    stage.sections.forEach(function(s) { allEvents = allEvents.concat(s.events); });
  }
  const doneCount = allEvents.filter(function(e) { return e.done; }).length;
  const totalCount = allEvents.length;
  const isComplete = doneCount === totalCount && totalCount > 0;
  let contentHtml = '';
  if (stage.sections) {
    contentHtml = stage.sections.map(renderSection).join('');
  }
  const noteHtml = stage.note ? '<div class="nt">' + stage.note + '</div>' : '';
  const stageClass = stage.current ? 'cur' : '';
  const badgeIcon = isComplete ? ICONS.check : ICONS.spinner;
  const badgeText = isComplete ? 'مكتملة ' + doneCount + '/' + totalCount : 'قيد العمل ' + doneCount + '/' + totalCount;
  return '<div class="st ' + stageClass + '"><div class="sd">' + (stage.current ? ICONS.flag : ICONS.check) + '</div><div class="sc"><div class="sh"><div><div class="sn">' + stage.title + '</div><div class="sb">' + stage.subtitle + '</div></div><div class="bdg">' + badgeIcon + ' ' + badgeText + '</div></div>' + contentHtml + noteHtml + '</div></div>';
}

function render() {
  const timeline = document.getElementById('timeline');
  const stages = [
    JOURNEY_DATA.beforeJudging,
    JOURNEY_DATA.day1,
    JOURNEY_DATA.day2,
    JOURNEY_DATA.next
  ];
  timeline.innerHTML = stages.map(renderStage).join('');
  document.getElementById('lu').innerHTML = '<svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + JOURNEY_DATA.lastUpdate;
}

render();
</script>
